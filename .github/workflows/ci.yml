name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LAKE_FORMAT: delta # run the whole suite against real Delta Lake tables
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Spark downloads the Delta Lake jars from Maven Central on first start; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-4.0.1-spark-4.0.5

      - name: Lint
        run: |
          ruff check src tests dags
          ruff format --check src tests dags

      - name: Tests (transformations, quality rules, Delta features, incremental runs, Airflow DAG end to end)
        run: pytest -q
